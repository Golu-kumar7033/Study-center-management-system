<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notification</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; margin:auto; background:#ffffff; border-radius:8px; overflow:hidden;">
    <tr>
      <td style="background-color:#2c3e50; color:#ffffff; padding:20px; text-align:center;">
        <h2>Libro Study Center</h2>
      </td>
    </tr>
    <tr>
      <td style="padding:20px; color:#333333;">
        <p>Dear Student,</p>
        <p>We are reaching out to notify you about an important update:</p>
        <p style="font-weight:bold; color:#2c3e50;">{{notification }}</p>
        <p>Thank you for your attention, and we look forward to your continued participation.</p>
        <p>Best regards,<br>
        Libro Study Center Team</p>
      </td>
    </tr>
    <tr>
      <td style="background-color:#ecf0f1; padding:15px; text-align:center; font-size:12px; color:#7f8c8d;">
        © {{year}} Libro Study Center. All rights reserved.
      </td>
    </tr>
  </table>
</body>
</html>
